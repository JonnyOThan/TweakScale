
// This needs to be kept in sync with ModuleEngines (or maybe we should just specify all the exponents here?)
// This module caches off the maxThrust value on OnStart, so if it runs before TweakScale then it'll have the wrong value
// https://github.com/KerbalPowers/KP-Dynamics/blob/main/Source/CavitationMod/Cavitation/ModuleSplashedThrust.cs
TWEAKSCALEEXPONENTS:NEEDS[KerbalPowers/Naval]
{
	name = ModuleSplashedThrust
	trueMaxThrust = 2.5
}

// because trueMaxThrust is cached in OnStart, it's typically set to 0 in the prefab which make it difficult to scale correctly
// copy the default maxThrust value here
@PART:HAS[@MODULE[ModuleSplashedThrust]:HAS[~trueMaxThrust&#maxThrust]]:NEEDS[KerbalPowers/Naval]:LAST[TweakScale]
{
	@MODULE[ModuleSplashedThrust]
	{
		trueMaxThrust = #$maxThrust$
	}
}
